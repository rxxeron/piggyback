# Nginx Reverse Proxy Configuration for hm.rxxeron.iam.bd
# Place in /etc/nginx/sites-available/hm.rxxeron.iam.bd on your server
# and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name hm.rxxeron.iam.bd;

    # Redirect HTTP to HTTPS (uncomment when SSL certificate is generated with certbot)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # WebSocket support (Required for Streamlit live reactivity)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}

